name: Q1 Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string'
        required: true
        default: '1.0.0'
        type: string
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.compute_outputs.outputs.build_tag }}
      build_date: ${{ steps.compute_outputs.outputs.build_date }}
    steps:
      - name: Compute Build Outputs
        id: compute_outputs
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TYPE="${{ github.event.inputs.release_type }}"
          RUN_NUMBER="${{ github.run_number }}"
          
          # Compute build tag: v<version>-<release_type>-<run_number>
          BUILD_TAG="v${VERSION}-${TYPE}-${RUN_NUMBER}"
          
          # Compute today's date in YYYY-MM-DD format
          BUILD_DATE=$(date +'%Y-%m-%d')
          
          # Expose outputs to the job level
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

  announce:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Print Job Outputs
        run: |
          echo "Build Tag: ${{ needs.prepare.outputs.build_tag }}"
          echo "Build Date: ${{ needs.prepare.outputs.build_date }}"
          
      - name: Write Summary Table
        run: |
          echo "### 🚀 Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ github.event.inputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Type** | ${{ github.event.inputs.release_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Tag** | \`${{ needs.prepare.outputs.build_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Date** | ${{ needs.prepare.outputs.build_date }} |" >> $GITHUB_STEP_SUMMARY
